<script type="module">
import * as THREE from 'three';

/* ================= 기본 설정 ================= */
const $ = s => document.querySelector(s);
const R = 110;              // 원형 맵 반지름(칸)
const G = 224, C = 112;     // 격자 크기, 중심
const N = G * G;
const TICK_MS = 1000 / 15, DT = 1 / 15;
const SPEED = 7;            // 초당 칸
const TURN = 5;             // 초당 회전(rad)
const RESPAWN_MS = 5000;
const MAXP = 30;
const PREFIX = 'classpaperio-v1-';
const CH = 12000;           // 메시지 쪼개기 크기

const inside = new Uint8Array(N); let TOTAL = 0;
for (let y = 0; y < G; y++) for (let x = 0; x < G; x++) {
  const dx = x + 0.5 - C, dy = y + 0.5 - C;
  if (dx * dx + dy * dy <= R * R) { inside[y * G + x] = 1; TOTAL++; }
}

const owner = new Uint8Array(N);   // 영토 주인 id
const trail = new Uint8Array(N);   // 선 주인 id
const area = new Int32Array(256);
let meta = new Map();              // id -> {id,name,banned,rgb,hex,darkHex,css}
const vis = new Map();             // id -> 화면 표시용 상태

let role = null;   // 'host' | 'client'
let myId = 0;
let spectateId = 0;
let zoom = 1;

function angDiff(a, b) { let d = a - b; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; }
function esc(s) { return String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch])); }

/* ================= 색상 ================= */
function hsl(h, s, l) {
  s /= 100; l /= 100;
  const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  return [Math.round(f(0) * 255), Math.round(f(8) * 255), Math.round(f(4) * 255)];
}
const toHex = c => (c[0] << 16) | (c[1] << 8) | c[2];
function colorsFor(id) {
  const i = (id - 1) % 30, h = ((i * 7) % 30) * 12, l = (i % 2) ? 50 : 62;
  const rgb = hsl(h, 72, l), dark = hsl(h, 65, l - 18);
  return { rgb, hex: toHex(rgb), darkHex: toHex(dark), css: `rgb(${rgb[0]},${rgb[1]},${rgb[2]})` };
}
function setMeta(list) {
  const m = new Map();
  for (const [id, name, banned] of list) m.set(id, Object.assign({ id, name, banned: !!banned }, colorsFor(id)));
  meta = m;
  for (const [id, v] of vis) if (!meta.has(id)) { removeVis(v); vis.delete(id); }
  repaintAll();
}

/* ================= 바닥 텍스처 ================= */
const texData = new Uint8Array(N * 4);
const dflag = new Uint8Array(N); const dlist = [];
function markDirty(c) { if (!dflag[c]) { dflag[c] = 1; dlist.push(c); } }
function paint(c) {
  const cx = c % G, cy = (c / G) | 0, ti = ((G - 1 - cy) * G + cx) * 4;
  let r, g, b; const o = owner[c], m = o ? meta.get(o) : null;
  if (m) { r = m.rgb[0]; g = m.rgb[1]; b = m.rgb[2]; }
  else { const v = ((cx + cy) & 1) ? 236 : 228; r = v; g = v + 3; b = v + 8; }
  const t = trail[c];
  if (t) { const tm = meta.get(t); if (tm) { // 반투명 선
    r = (r * 0.45 + tm.rgb[0] * 0.55) | 0; g = (g * 0.45 + tm.rgb[1] * 0.55) | 0; b = (b * 0.45 + tm.rgb[2] * 0.55) | 0; } }
  texData[ti] = r; texData[ti + 1] = g; texData[ti + 2] = b; texData[ti + 3] = 255;
}
function repaintAll() { for (let c = 0; c < N; c++) markDirty(c); }

/* ================= 3D 장면 ================= */
const canvas = $('#c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
renderer.setSize(innerWidth, innerHeight);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1b2233);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.5, 1200);
scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.3); sun.position.set(60, 120, 40); scene.add(sun);

const tex = new THREE.DataTexture(texData, G, G, THREE.RGBAFormat);
tex.magFilter = THREE.NearestFilter; tex.minFilter = THREE.LinearFilter;
tex.colorSpace = THREE.SRGBColorSpace; tex.needsUpdate = true;

{ // 원형 바닥
  const geo = new THREE.CircleGeometry(R, 180);
  const pos = geo.attributes.position, uv = geo.attributes.uv;
  for (let i = 0; i < pos.count; i++) uv.setXY(i, (pos.getX(i) + G / 2) / G, (pos.getY(i) + G / 2) / G);
  const ground = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map: tex }));
  ground.rotation.x = -Math.PI / 2; scene.add(ground);
  const rim = new THREE.Mesh(new THREE.TorusGeometry(R + 0.5, 0.7, 10, 180), new THREE.MeshLambertMaterial({ color: 0x9fb0d0 }));
  rim.rotation.x = -Math.PI / 2; rim.position.y = 0.2; scene.add(rim);
  const base = new THREE.Mesh(new THREE.CylinderGeometry(R + 0.4, R - 6, 10, 120), new THREE.MeshLambertMaterial({ color: 0x3a4560 }));
  base.position.y = -5.02; scene.add(base);
}

const SHAPES = [
  new THREE.BoxGeometry(1.1, 1.1, 1.1),
  new THREE.CylinderGeometry(0.62, 0.62, 1.1, 20),
  new THREE.OctahedronGeometry(0.8),
  new THREE.DodecahedronGeometry(0.72),
  new THREE.ConeGeometry(0.78, 1.3, 4),
];
const PTR_GEO = new THREE.ConeGeometry(0.22, 0.5, 10);
const PTR_MAT = new THREE.MeshLambertMaterial({ color: 0xffffff });
const BLOB_GEO = new THREE.CircleGeometry(0.8, 20);
const BLOB_MAT = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.25, depthWrite: false });

function makeLabel(text) {
  const cv = document.createElement('canvas'); cv.width = 320; cv.height = 64;
  const g = cv.getContext('2d');
  g.font = "bold 28px 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif";
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.lineWidth = 6; g.strokeStyle = 'rgba(0,0,0,0.75)'; g.strokeText(text, 160, 34);
  g.fillStyle = '#fff'; g.fillText(text, 160, 34);
  const tx = new THREE.CanvasTexture(cv); tx.colorSpace = THREE.SRGBColorSpace;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tx, depthTest: false, depthWrite: false, sizeAttenuation: false, transparent: true }));
  sp.scale.set(0.2, 0.04, 1); sp.center.set(0.5, 0); sp.renderOrder = 10;
  return sp;
}
function makeVis(id) { const v = { id, rx: C, ry: C, ra: 0, sx: C, sy: C, sa: 0, alive: false, gone: false, t: 0, deadAt: 0, mesh: null }; vis.set(id, v); return v; }
function removeVis(v) {
  if (v.mesh) scene.remove(v.mesh);
  if (v.label) { scene.remove(v.label); v.label.material.map.dispose(); v.label.material.dispose(); }
}
function ensureMesh(v, m) {
  if (!v.mesh) {
    const grp = new THREE.Group();
    v.mat = new THREE.MeshLambertMaterial({ color: m.darkHex });
    v.body = new THREE.Mesh(SHAPES[(v.id - 1) % SHAPES.length], v.mat); grp.add(v.body);
    const ptr = new THREE.Mesh(PTR_GEO, PTR_MAT); ptr.rotation.z = -Math.PI / 2; ptr.position.set(0.95, 0, 0); grp.add(ptr);
    const blob = new THREE.Mesh(BLOB_GEO, BLOB_MAT); blob.rotation.x = -Math.PI / 2; blob.position.y = -0.57; grp.add(blob);
    scene.add(grp); v.mesh = grp; v.colorHex = m.darkHex;
  }
  if (v.colorHex !== m.darkHex) { v.mat.color.setHex(m.darkHex); v.colorHex = m.darkHex; }
  if (v.labelName !== m.name) {
    if (v.label) { scene.remove(v.label); v.label.material.map.dispose(); v.label.material.dispose(); }
    v.label = makeLabel(m.name); scene.add(v.label); v.labelName = m.name;
  }
}

/* ================= 메시지 전송 (큰 메시지는 쪼갬) ================= */
function sendStr(conn, s) {
  if (!conn || !conn.open) return;
  try {
    if (s.length <= CH) { conn.send(s); return; }
    const id = Math.random().toString(36).slice(2, 8), n = Math.ceil(s.length / CH);
    for (let i = 0; i < n; i++) conn.send('#' + id + '|' + i + '|' + n + '|' + s.slice(i * CH, (i + 1) * CH));
  } catch (e) { console.warn(e); }
}
function makeReceiver(handler) {
  const parts = {}; const dec = new TextDecoder();
  return data => {
    if (typeof data !== 'string') data = dec.decode(data);
    let msg;
    if (data[0] === '#') {
      const a = data.indexOf('|'), b = data.indexOf('|', a + 1), c = data.indexOf('|', b + 1);
      const id = data.slice(1, a), i = +data.slice(a + 1, b), n = +data.slice(b + 1, c);
      const arr = parts[id] || (parts[id] = { p: [], cnt: 0 });
      arr.p[i] = data.slice(c + 1); arr.cnt++;
      if (arr.cnt < n) return;
      delete parts[id]; msg = JSON.parse(arr.p.join(''));
    } else msg = JSON.parse(data);
    handler(msg);
  };
}
function rleEncode(arr) { const out = []; let v = arr[0], n = 1; for (let i = 1; i < arr.length; i++) { if (arr[i] === v) n++; else { out.push(v, n); v = arr[i]; n = 1; } } out.push(v, n); return out; }
function rleDecode(rle, arr) { let i = 0; for (let k = 0; k < rle.length; k += 2) { arr.fill(rle[k], i, i + rle[k + 1]); i += rle[k + 1]; } }

/* ================= 방장(서버) 게임 로직 ================= */
const sim = { players: new Map() };
const bannedNames = new Set();
const chOF = new Uint8Array(N), chTF = new Uint8Array(N); const chO = [], chT = [];
const events = [];
let hostPeer = null;

function setOwner(c, id) {
  const p = owner[c]; if (p === id) return;
  if (p) area[p]--; owner[c] = id; if (id) area[id]++;
  if (!chOF[c]) { chOF[c] = 1; chO.push(c); } markDirty(c);
}
function setTrail(c, id) {
  if (trail[c] === id) return; trail[c] = id;
  if (!chTF[c]) { chTF[c] = 1; chT.push(c); } markDirty(c);
}
function freeSlot() { for (let i = 1; i <= 60; i++) if (!sim.players.has(i)) return i; return 0; }

function areaFree(x, y, rad) {
  for (let dy = -rad; dy <= rad; dy++) for (let dx = -rad; dx <= rad; dx++) {
    const cx = (x | 0) + dx, cy = (y | 0) + dy; if (cx < 0 || cy < 0 || cx >= G || cy >= G) return false;
    const c = cy * G + cx; if (!inside[c] || owner[c] || trail[c]) return false;
  }
  return true;
}
function spawn(p) {
  let x = C, y = C, ok = false;
  for (let k = 0; k < 150 && !ok; k++) {
    const a = Math.random() * Math.PI * 2, r = Math.sqrt(Math.random()) * (R - 10);
    x = C + Math.cos(a) * r; y = C + Math.sin(a) * r; ok = areaFree(x, y, 5);
  }
  const cx0 = x | 0, cy0 = y | 0;
  p.x = cx0 + 0.5; p.y = cy0 + 0.5;
  for (let dy = -3; dy <= 3; dy++) for (let dx = -3; dx <= 3; dx++) {
    if (dx * dx + dy * dy > 2.6 * 2.6) continue;
    const c = (cy0 + dy) * G + (cx0 + dx); if (inside[c]) setOwner(c, p.id);
  }
  p.a = p.ta = Math.random() * Math.PI * 2 - Math.PI;
  p.trail = []; p.alive = true;
  checkZero(p.id);
}
function clearPlayer(p) {
  for (const c of p.trail) if (trail[c] === p.id) setTrail(c, 0);
  p.trail = [];
  if (area[p.id] > 0) for (let c = 0; c < N; c++) if (owner[c] === p.id) setOwner(c, 0);
}
function kill(v, by, kind) {
  if (!v.alive) return;
  clearPlayer(v); v.alive = false; v.respawnAt = performance.now() + RESPAWN_MS;
  if (kind) events.push([by, v.id, kind]);
}
function checkZero(by) {
  for (const q of sim.players.values()) if (q.alive && !q.banned && area[q.id] <= 0) kill(q, by, 3);
}
function capture(p) {
  for (const c of p.trail) { setTrail(c, 0); setOwner(c, p.id); }
  p.trail = [];
  // 내 땅을 감싸는 사각형
  let x0 = G, y0 = G, x1 = -1, y1 = -1;
  for (let c = 0; c < N; c++) if (owner[c] === p.id) {
    const x = c % G, y = (c / G) | 0;
    if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
  }
  if (x1 < 0) return;
  x0 = Math.max(0, x0 - 1); y0 = Math.max(0, y0 - 1); x1 = Math.min(G - 1, x1 + 1); y1 = Math.min(G - 1, y1 + 1);
  const w = x1 - x0 + 1, h = y1 - y0 + 1;
  const seen = new Uint8Array(w * h), q = new Int32Array(w * h); let qh = 0, qt = 0;
  const id = p.id;
  const push = (x, y) => { const li = (y - y0) * w + (x - x0); if (seen[li]) return; if (owner[y * G + x] === id) return; seen[li] = 1; q[qt++] = li; };
  for (let x = x0; x <= x1; x++) { push(x, y0); push(x, y1); }
  for (let y = y0; y <= y1; y++) { push(x0, y); push(x1, y); }
  while (qh < qt) {
    const li = q[qh++], lx = li % w, ly = (li / w) | 0, x = lx + x0, y = ly + y0;
    if (lx > 0) push(x - 1, y); if (lx < w - 1) push(x + 1, y);
    if (ly > 0) push(x, y - 1); if (ly < h - 1) push(x, y + 1);
  }
  // 바깥과 이어지지 않은 칸 = 둘러싸인 칸 → 내 땅
  for (let ly = 0; ly < h; ly++) for (let lx = 0; lx < w; lx++) {
    if (seen[ly * w + lx]) continue;
    const c = (ly + y0) * G + (lx + x0);
    if (inside[c] && owner[c] !== id) setOwner(c, id);
  }
  checkZero(id);
}
function enterCell(p, c) {
  if (!inside[c]) return;
  const t = trail[c];
  if (t) {
    if (t === p.id) { kill(p, p.id, 2); return; }
    const v = sim.players.get(t); if (v && v.alive) kill(v, p.id, 1);
  }
  if (owner[c] === p.id) { if (p.trail.length) capture(p); }
  else { setTrail(c, p.id); p.trail.push(c); }
}
function tick() {
  const now = performance.now();
  for (const p of sim.players.values()) {
    if (p.banned) continue;
    if (!p.alive) { if (now >= p.respawnAt) spawn(p); continue; }
    let d = angDiff(p.ta, p.a); const m = TURN * DT; if (d > m) d = m; if (d < -m) d = -m; p.a += d;
    let nx = p.x + Math.cos(p.a) * SPEED * DT, ny = p.y + Math.sin(p.a) * SPEED * DT;
    const dx = nx - C, dy = ny - C, dist = Math.hypot(dx, dy), lim = R - 0.8;
    if (dist > lim) { nx = C + dx / dist * lim; ny = C + dy / dist * lim; }
    const ocx = p.x | 0, ocy = p.y | 0, ncx = nx | 0, ncy = ny | 0;
    p.x = nx; p.y = ny;
    if (ncx !== ocx || ncy !== ocy) {
      if (ncx !== ocx && ncy !== ocy) { enterCell(p, ocy * G + ncx); if (!p.alive) continue; } // 대각선 이동 시 빈틈 방지
      enterCell(p, ncy * G + ncx);
    }
  }
  broadcast();
}
function encodeGroups(list, flag, arr) {
  list.sort((a, b) => a - b);
  const groups = new Map();
  for (const c of list) {
    flag[c] = 0; const id = arr[c]; let g = groups.get(id);
    if (!g) { g = { runs: [], end: -2 }; groups.set(id, g); }
    if (g.end === c) { g.runs[g.runs.length - 1]++; g.end++; } else { g.runs.push(c, 1); g.end = c + 1; }
  }
  list.length = 0;
  const out = []; for (const [id, g] of groups) out.push([id].concat(g.runs)); return out;
}
function broadcast() {
  const ps = [];
  for (const p of sim.players.values()) if (!p.banned) ps.push([p.id, Math.round(p.x * 100), Math.round(p.y * 100), Math.round(p.a * 100), p.alive ? 1 : 0]);
  const msg = { t: 's', p: ps };
  if (chO.length) msg.o = encodeGroups(chO, chOF, owner);
  if (chT.length) msg.r = encodeGroups(chT, chTF, trail);
  if (events.length) msg.e = events.splice(0);
  const str = JSON.stringify(msg);
  for (const p of sim.players.values()) if (p.conn && p.welcomed) sendStr(p.conn, str);
  onSnapshot(msg, true);
}
function metaList() { return [...sim.players.values()].map(p => [p.id, p.name, p.banned ? 1 : 0]); }
function broadcastMeta() {
  const list = metaList(), str = JSON.stringify({ t: 'm', m: list });
  for (const p of sim.players.values()) if (p.conn && p.welcomed) sendStr(p.conn, str);
  setMeta(list);
}
function onHostMsg(conn, msg) {
  if (msg.t === 'j') {
    if (conn._pid) return;
    if (sim.players.size >= MAXP) { sendStr(conn, JSON.stringify({ t: 'x', m: '방이 가득 찼어요 (최대 30명).' })); return; }
    const id = freeSlot(); if (!id) return;
    const name = (String(msg.n || '').trim().slice(0, 10)) || ('학생' + id);
    const p = { id, name, conn, x: C, y: C, a: 0, ta: 0, alive: false, respawnAt: 0, trail: [], banned: bannedNames.has(name), welcomed: false };
    sim.players.set(id, p); conn._pid = id;
    if (!p.banned) spawn(p);
    sendStr(conn, JSON.stringify({ t: 'w', id, o: rleEncode(owner), r: rleEncode(trail), m: metaList() }));
    p.welcomed = true;
    broadcastMeta();
  } else if (msg.t === 'i') {
    const p = sim.players.get(conn._pid);
    if (p && Number.isFinite(msg.a)) p.ta = msg.a;
  }
}
function onHostClose(conn) {
  const id = conn._pid; if (!id) return; conn._pid = 0;
  const p = sim.players.get(id); if (!p || p.conn !== conn) return;
  clearPlayer(p); sim.players.delete(id); area[id] = 0;
  broadcastMeta();
}
function setBan(id, on) {
  const p = sim.players.get(id); if (!p) return;
  p.banned = on;
  if (on) { bannedNames.add(p.name); clearPlayer(p); p.alive = false; if (spectateId === id) spectateId = 0; }
  else { bannedNames.delete(p.name); p.alive = false; p.respawnAt = 0; }
  broadcastMeta();
}
function resetAll() {
  for (const p of sim.players.values()) { p.trail = []; p.alive = false; p.respawnAt = 0; }
  for (let c = 0; c < N; c++) { if (owner[c]) setOwner(c, 0); if (trail[c]) setTrail(c, 0); }
}
function startTicker() {
  try { // 워커 타이머: 탭이 가려져도 덜 느려짐
    const src = 'let iv=null;onmessage=e=>{clearInterval(iv);iv=setInterval(()=>postMessage(0),e.data);}';
    const w = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
    w.onmessage = () => tick(); w.postMessage(TICK_MS);
  } catch (e) { setInterval(tick, TICK_MS); }
}
function genCode() { const s = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; let o = ''; for (let i = 0; i < 5; i++) o += s[(Math.random() * s.length) | 0]; return o; }

function startHost() {
  if (typeof Peer === 'undefined') { $('#lobbyMsg').textContent = '통신 라이브러리를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.'; return; }
  role = 'host';
  $('#lobbyMsg').textContent = '방을 만드는 중...';
  const code = genCode();
  const peer = new Peer(PREFIX + code, { debug: 1 });
  hostPeer = peer;
  peer.on('open', () => {
    $('#lobby').classList.add('hidden');
    $('#hostPanel').classList.remove('hidden'); $('#rank').classList.remove('hidden');
    $('#roomCode').textContent = code;
    const link = location.protocol.startsWith('http') ? `${location.origin}${location.pathname}?room=${code}` : '(GitHub Pages 등에 올리면 접속 링크가 표시돼요)';
    $('#joinLink').textContent = link;
    startTicker();
  });
  peer.on('connection', conn => {
    conn.on('data', makeReceiver(msg => onHostMsg(conn, msg)));
    conn.on('close', () => onHostClose(conn));
    conn.on('error', () => onHostClose(conn));
  });
  peer.on('disconnected', () => setTimeout(() => { try { if (!peer.destroyed) peer.reconnect(); } catch (e) { } }, 1500));
  peer.on('error', e => {
    if (e.type === 'unavailable-id') { peer.destroy(); startHost(); return; }
    if (e.type === 'peer-unavailable') return;
    console.warn(e);
    if (!sim.players.size && !$('#lobby').classList.contains('hidden')) $('#lobbyMsg').textContent = '방을 만들 수 없어요: ' + e.type + ' (학교 네트워크가 막았을 수 있어요)';
  });
}

/* ================= 학생(클라이언트) ================= */
let hostConn = null;
function showCenter(html) { const el = $('#center'); el.innerHTML = html; el.classList.remove('hidden'); }
function fatal(text) {
  $('#lobby').classList.add('hidden');
  showCenter(`${esc(text)}<br><button onclick="location.reload()">처음으로</button>`);
  fatalShown = true;
}
let fatalShown = false;
function startClient(code, name) {
  if (typeof Peer === 'undefined') { $('#lobbyMsg').textContent = '통신 라이브러리를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.'; return; }
  role = 'client';
  $('#lobbyMsg').textContent = '접속하는 중...';
  $('#btnJoin').disabled = true; $('#btnHost').disabled = true;
  const peer = new Peer({ debug: 1 });
  const to = setTimeout(() => { if (!myId) fatal('연결 시간이 초과됐어요. 방 코드를 확인하거나, 학교 네트워크가 연결을 막고 있는지 확인해 주세요.'); }, 15000);
  peer.on('open', () => {
    hostConn = peer.connect(PREFIX + code, { serialization: 'raw', reliable: true });
    hostConn.on('open', () => sendStr(hostConn, JSON.stringify({ t: 'j', n: name })));
    hostConn.on('data', makeReceiver(onClientMsg));
    hostConn.on('close', () => { if (!fatalShown) fatal('방장과 연결이 끊어졌어요.'); });
  });
  peer.on('error', e => {
    clearTimeout(to);
    if (e.type === 'peer-unavailable') fatal('방을 찾을 수 없어요. 방 코드를 확인해 주세요.');
    else if (!myId) fatal('연결 오류: ' + e.type);
  });
}
function onClientMsg(msg) {
  if (msg.t === 'x') { fatal(msg.m); return; }
  if (msg.t === 'w') {
    myId = msg.id;
    rleDecode(msg.o, owner); rleDecode(msg.r, trail);
    area.fill(0); for (let c = 0; c < N; c++) if (owner[c]) area[owner[c]]++;
    setMeta(msg.m);
    $('#lobby').classList.add('hidden'); $('#rank').classList.remove('hidden'); $('#help').classList.remove('hidden');
    return;
  }
  if (msg.t === 'm') { setMeta(msg.m); return; }
  if (msg.t === 's') onSnapshot(msg, false);
}
function applyGroups(groups, arr, isOwner) {
  for (const g of groups) {
    const id = g[0];
    for (let k = 1; k < g.length; k += 2) {
      const s = g[k], e = s + g[k + 1];
      for (let c = s; c < e; c++) {
        const old = arr[c];
        if (old !== id) { if (isOwner) { area[old]--; area[id]++; } arr[c] = id; markDirty(c); }
      }
    }
  }
}
function onSnapshot(msg, isHost) {
  const now = performance.now(), seen = new Set();
  for (const [id, x, y, a, al] of msg.p) {
    seen.add(id);
    const v = vis.get(id) || makeVis(id);
    const nx = x / 100, ny = y / 100, na = a / 100, alive = !!al;
    if (alive && (!v.alive || Math.hypot(nx - v.rx, ny - v.ry) > 6)) { v.rx = nx; v.ry = ny; v.ra = na; }
    if (v.alive && !alive) v.deadAt = now;
    v.sx = nx; v.sy = ny; v.sa = na; v.alive = alive; v.t = now;
  }
  for (const [id, v] of vis) v.gone = !seen.has(id);
  if (!isHost) {
    if (msg.o) applyGroups(msg.o, owner, true);
    if (msg.r) applyGroups(msg.r, trail, false);
  }
  if (msg.e) for (const ev of msg.e) addFeed(ev);
}

/* ================= 화면 표시 ================= */
function addFeed([by, victim, kind]) {
  const nm = id => (meta.get(id) || {}).name || '?';
  let text;
  if (kind === 1) text = `✂️ ${nm(by)}님이 ${nm(victim)}님의 선을 끊었어요!`;
  else if (kind === 2) text = `💥 ${nm(victim)}님이 자기 선에 걸렸어요`;
  else text = `🏳️ ${nm(victim)}님이 땅을 모두 잃었어요`;
  const feed = $('#feed'), el = document.createElement('div'); el.textContent = text;
  feed.appendChild(el); while (feed.children.length > 4) feed.removeChild(feed.firstChild);
  setTimeout(() => el.remove(), 4000);
}
function updateRank() {
  const arr = [...meta.values()].filter(m => !m.banned).map(m => ({ id: m.id, name: m.name, a: Math.max(0, area[m.id]), css: m.css })).sort((a, b) => b.a - a.a);
  let html = '';
  arr.slice(0, 10).forEach((r, i) => {
    html += `<li data-id="${r.id}" class="${r.id === myId ? 'me' : ''}"><span class="no">${i + 1}</span><span class="sw" style="background:${r.css}"></span><span class="nm">${esc(r.name)}</span><span class="pc">${(r.a / TOTAL * 100).toFixed(1)}%</span></li>`;
  });
  $('#rankList').innerHTML = html || '<li style="opacity:.6">아직 참가자가 없어요</li>';
  let mine = '';
  if (role === 'client' && myId) {
    const idx = arr.findIndex(r => r.id === myId);
    if (idx >= 10) mine = `내 순위 ${idx + 1}위 · ${(arr[idx].a / TOTAL * 100).toFixed(1)}%`;
  }
  $('#myRank').textContent = mine;
}
function updatePlist() {
  const ps = [...sim.players.values()].sort((a, b) => area[b.id] - area[a.id]);
  $('#pcount').textContent = ps.length;
  let html = '';
  for (const p of ps) {
    const m = meta.get(p.id); if (!m) continue;
    const st = p.banned ? '관전' : (p.alive ? (area[p.id] / TOTAL * 100).toFixed(1) + '%' : '부활중');
    html += `<div class="pr"><span class="sw" style="background:${m.css}"></span><span class="nm" data-act="follow" data-id="${p.id}" style="cursor:pointer">${spectateId === p.id ? '👁 ' : ''}${esc(p.name)}</span><span class="pc">${st}</span>` +
      `<button data-act="${p.banned ? 'unban' : 'ban'}" data-id="${p.id}" class="${p.banned ? '' : 'danger'}">${p.banned ? '참가 허용' : '관전 전환'}</button></div>`;
  }
  $('#plist').innerHTML = html || '<div style="opacity:.6;font-size:13px">학생들이 방 코드로 들어오면 여기에 보여요</div>';
}
let lastCenter = '';
function updateCenter(now) {
  if (fatalShown) return;
  let html = '';
  if (role === 'client' && myId) {
    const me = vis.get(myId), mm = meta.get(myId);
    if (mm && mm.banned) html = '👀 관전 모드<small>방장이 관전으로 바꿨어요. ←/→ 키나 랭킹 이름을 눌러 다른 친구를 볼 수 있어요.</small>';
    else if (me && !me.alive && me.deadAt) {
      const s = Math.max(1, Math.ceil((me.deadAt + RESPAWN_MS - now) / 1000));
      html = `선이 끊겼어요!<small>${s}초 후 다시 태어나요</small>`;
    }
  }
  if (html !== lastCenter) {
    lastCenter = html; const el = $('#center');
    if (html) { el.innerHTML = html; el.classList.remove('hidden'); } else el.classList.add('hidden');
  }
}
function aliveIds() { return [...vis.values()].filter(v => v.alive && !v.gone).map(v => v.id).sort((a, b) => a - b); }
function cycleSpectate(dir) {
  const ids = aliveIds(); if (!ids.length) { spectateId = 0; return; }
  let i = ids.indexOf(spectateId); i = (i + dir + ids.length) % ids.length; spectateId = ids[i];
}

const camPos = new THREE.Vector3(0, 235, 150), camLook = new THREE.Vector3(0, 0, 8);
const _p = new THREE.Vector3(), _l = new THREE.Vector3();
let pScale = 2.6;
function updateCamera(dt, now) {
  let fx = null, fy = null;
  const mm = meta.get(myId), banned = !!(mm && mm.banned);
  if (role === 'client' && myId && !banned) {
    const me = vis.get(myId);
    if (me && (me.alive || me.deadAt)) { fx = me.rx; fy = me.ry; }
  }
  if (fx === null && role === 'client' && banned) {
    const s = vis.get(spectateId); if (!s || !s.alive || s.gone) cycleSpectate(1);
  }
  if (fx === null && spectateId) { const s = vis.get(spectateId); if (s && s.alive && !s.gone) { fx = s.rx; fy = s.ry; } }
  let ts;
  if (fx !== null) { _l.set(fx - G / 2, 0, fy - G / 2); _p.set(_l.x, 26 * zoom, _l.z + 20 * zoom); ts = 1; }
  else { _l.set(0, 0, 8); _p.set(0, 235, 150); ts = 2.6; }
  const k = 1 - Math.exp(-dt * 6);
  camPos.lerp(_p, k); camLook.lerp(_l, k);
  camera.position.copy(camPos); camera.lookAt(camLook);
  pScale += (ts - pScale) * k;
}
function updateVis(v, dt, now) {
  const m = meta.get(v.id);
  if (!m || m.banned || v.gone || !v.alive) { if (v.mesh) { v.mesh.visible = false; v.label.visible = false; } return; }
  ensureMesh(v, m);
  const e = Math.min((now - v.t) / 1000, 0.15);
  const tx = v.sx + Math.cos(v.sa) * SPEED * e, ty = v.sy + Math.sin(v.sa) * SPEED * e;
  const k = 1 - Math.exp(-dt * 14);
  v.rx += (tx - v.rx) * k; v.ry += (ty - v.ry) * k; v.ra += angDiff(v.sa, v.ra) * k;
  const wx = v.rx - G / 2, wz = v.ry - G / 2;
  v.mesh.visible = true; v.label.visible = true;
  v.mesh.scale.setScalar(pScale);
  v.mesh.position.set(wx, 0.6 * pScale, wz);
  v.mesh.rotation.y = -v.ra;
  v.body.position.y = Math.sin(now / 180 + v.id) * 0.08;
  v.label.position.set(wx, 1.5 * pScale, wz);
  const ls = pScale > 1.5 ? 0.7 : 1; v.label.scale.set(0.2 * ls, 0.04 * ls, 1);
}

let last = performance.now(), lastHud = 0;
function frame() {
  requestAnimationFrame(frame);
  const now = performance.now(), dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (dlist.length) { for (const c of dlist) { paint(c); dflag[c] = 0; } dlist.length = 0; tex.needsUpdate = true; }
  for (const v of vis.values()) updateVis(v, dt, now);
  updateCamera(dt, now);
  renderer.render(scene, camera);
  updateCenter(now);
  if (now - lastHud > 500) { lastHud = now; if (role) updateRank(); if (role === 'host') updatePlist(); }
}
requestAnimationFrame(frame);

/* ================= 입력 ================= */
let tAng = 0, lastSent = null; const keys = new Set();
function pointerSteer(e) {
  if (role !== 'client') return;
  const dx = e.clientX - innerWidth / 2, dy = e.clientY - innerHeight / 2;
  if (dx * dx + dy * dy < 100) return;
  tAng = Math.atan2(dy, dx);
}
window.addEventListener('pointermove', pointerSteer);
window.addEventListener('pointerdown', pointerSteer);
function keySteer() {
  const has = (...k) => k.some(x => keys.has(x));
  const x = (has('arrowright', 'd') ? 1 : 0) - (has('arrowleft', 'a') ? 1 : 0);
  const y = (has('arrowdown', 's') ? 1 : 0) - (has('arrowup', 'w') ? 1 : 0);
  if (x || y) tAng = Math.atan2(y, x);
}
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const k = e.key.toLowerCase(); keys.add(k);
  if (k.startsWith('arrow')) e.preventDefault();
  const mm = meta.get(myId);
  if (role === 'client' && mm && mm.banned) { if (k === 'arrowright') cycleSpectate(1); if (k === 'arrowleft') cycleSpectate(-1); return; }
  keySteer();
});
window.addEventListener('keyup', e => { keys.delete(e.key.toLowerCase()); keySteer(); });
setInterval(() => {
  if (role !== 'client' || !hostConn || !myId) return;
  if (lastSent === null || Math.abs(angDiff(tAng, lastSent)) > 0.01) { sendStr(hostConn, JSON.stringify({ t: 'i', a: +tAng.toFixed(3) })); lastSent = tAng; }
}, 50);
window.addEventListener('wheel', e => { zoom = Math.min(3, Math.max(0.5, zoom * (1 + e.deltaY * 0.001))); }, { passive: true });
window.addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });

$('#rankList').addEventListener('pointerdown', e => {
  const li = e.target.closest('li[data-id]'); if (!li) return;
  const mm = meta.get(myId);
  if (role === 'host' || (mm && mm.banned)) spectateId = +li.dataset.id;
});
$('#plist').addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const id = +el.dataset.id, act = el.dataset.act;
  if (act === 'follow') spectateId = (spectateId === id) ? 0 : id;
  else if (act === 'ban') setBan(id, true);
  else if (act === 'unban') setBan(id, false);
  updatePlist();
});
$('#btnOverview').addEventListener('click', () => { spectateId = 0; });
$('#btnReset').addEventListener('click', () => { if (confirm('모든 땅을 초기화하고 모두 다시 시작할까요?')) resetAll(); });

/* ================= 로비 ================= */
const qsRoom = new URLSearchParams(location.search).get('room');
if (qsRoom) $('#inCode').value = qsRoom.toUpperCase();
try { const saved = localStorage.getItem('paperio-name'); if (saved) $('#inName').value = saved; } catch (e) { }
$('#btnHost').addEventListener('click', () => { if (!role) startHost(); });
$('#btnJoin').addEventListener('click', () => {
  if (role) return;
  const name = $('#inName').value.trim(), code = $('#inCode').value.trim().toUpperCase();
  if (!name) { $('#lobbyMsg').textContent = '이름을 입력해 주세요.'; return; }
  if (code.length !== 5) { $('#lobbyMsg').textContent = '5글자 방 코드를 입력해 주세요.'; return; }
  try { localStorage.setItem('paperio-name', name); } catch (e) { }
  startClient(code, name);
});
['inName', 'inCode'].forEach(id => $('#' + id).addEventListener('keydown', e => { if (e.key === 'Enter') $('#btnJoin').click(); }));
</script>
