<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#1b2233;touch-action:none;
    font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,sans-serif;color:#fff;user-select:none;-webkit-user-select:none}

  .card{background:#fff;color:#1d2433;border-radius:16px;padding:24px 26px;width:340px;max-width:92vw;box-shadow:0 10px 40px rgba(0,0,0,.4)}

  .card input{width:100%;font:inherit;font-size:16px;padding:9px 10px;border:1.5px solid #ccd3e0;border-radius:8px}

  .rcard h2{margin:0 0 18px;font-size:26px}

  .pl .rp{font-size:14px;color:#5a6378;margin-bottom:6px}
  .pl .mem{font-size:11px;color:#6b7488;margin-bottom:6px;max-height:44px;overflow:auto}
  .pl .step{width:100%;border-radius:10px 10px 0 0;color:#fff;font-weight:800;font-size:22px;display:flex;align-items:center;justify-content:center;text-shadow:0 1px 3px rgba(0,0,0,.4)}
  .p1 .step{height:120px}.p2 .step{height:86px}.p3 .step{height:62px}
  .rcard .row button{font-size:15px;padding:11px}
  .rcard #rQuit{background:#e9edf5;color:#1d2433}
  @media (max-width:700px){
    #rank{width:150px;font-size:12px;padding:6px 8px}

    .pl{width:96px}
  }
</style>

<body>
<canvas id="c"></canvas>

<div id="rank" class="panel hidden">
  <div class="ttl" id="rankTitle">🏆 영토 랭킹</div>
  <ol id="rankList"></ol>
  <div id="myRank"></div>
</div>
<div id="timer" class="hidden"></div>
<div id="feed"></div>
<div id="center" class="hidden"></div>
<div id="help" class="hidden">마우스가 있는 쪽으로 움직여요 · 방향키/WASD도 돼요</div>
<div id="teamPick" class="panel hidden"><div class="ttl" id="teamTitle">팀을 골라 주세요</div><div id="teamBtns"></div></div>
<div id="joy" class="hidden"><div id="knob"></div></div>
<div id="results" class="hidden"><div class="rcard" id="resultsCard"></div></div>

<div id="hostPanel" class="panel hidden">
  <div class="ttl">방 코드</div>
  <div id="roomCode">-----</div>
  <div id="joinLink"></div>
  <div class="warn">⚠ 이 탭이 게임 서버예요. 닫거나 최소화하지 마세요.</div>

  <div id="setup" class="box">
    <div class="ttl">대기방 · 게임 설정</div>
    <div class="seg"><button id="mSolo" class="on">개인전</button><button id="mTeam">팀전</button></div>
    <label class="fl" id="teamRow">팀 수 (2~10) <input id="inTeams" type="number" min="2" max="10" value="2"></label>
    <label class="fl">제한 시간 (10~9999초) <input id="inTime" type="number" min="10" max="9999" value="180"></label>
    <button id="btnStart" class="primary wide">▶ 게임 시작</button>
  </div>
  <div id="running" class="box hidden">
    <div class="fl">남은 시간 <b id="hostTime" style="font-size:18px">0:00</b></div>
    <button id="btnStop" class="danger wide">지금 끝내고 결과 보기</button>
  </div>

  <div class="row"><button id="btnOverview">전체 보기</button></div>
  <div class="ttl">참가자 <span id="pcount">0</span> / 30 <span style="font-weight:400;opacity:.7">(이름 클릭 = 따라가며 보기)</span></div>
  <div id="plist"></div>
</div>

<div id="lobby">
  <div class="card">
    <h1>🟦 학급 땅따먹기 3D</h1>
    <p class="sub">선을 그리며 돌아다니다 내 땅으로 돌아오면<br>그린 모양 그대로 내 땅이 돼요!</p>
    <label for="inName">이름</label>
    <input id="inName" maxlength="10" placeholder="이름 (최대 10자)" autocomplete="off">
    <label for="inCode">방 코드</label>
    <input id="inCode" maxlength="5" placeholder="예: K7P2Q" autocomplete="off" style="text-transform:uppercase">
    <button id="btnJoin" class="primary">참가하기</button>
    <div class="or">또는</div>
    <button id="btnHost">방 만들기 (선생님용)</button>
    <div id="hostBox" class="hidden">
      <label for="inTeacher">선생님 코드</label>
      <input id="inTeacher" type="password" placeholder="선생님 코드를 입력하세요" autocomplete="off">
      <button id="btnHostGo" class="primary">방 열기</button>
    </div>
    <div id="lobbyMsg"></div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';

/* ================= 기본 설정 ================= */
const TEACHER_CODE = 'teacher';   // ← 선생님 코드 (원하는 값으로 바꾸세요)

const $ = s => document.querySelector(s);
const R = 110;              // 원형 맵 반지름(칸)
const G = 224, C = 112;     // 격자 크기, 중심
const N = G * G;
const TICK_MS = 1000 / 15, DT = 1 / 15;
const SPEED = 7;            // 초당 칸
const TURN = 5;             // 초당 회전(rad)
const RESPAWN_MS = 5000;
const MAXP = 30;
const PREFIX = 'classpaperio-v2-';
const CH = 12000;
const TEAMS = [
  ['빨강팀', [231, 76, 60]], ['파랑팀', [52, 132, 219]], ['초록팀', [46, 184, 103]], ['노랑팀', [236, 190, 20]], ['보라팀', [150, 89, 190]],
  ['주황팀', [235, 130, 40]], ['청록팀', [26, 178, 160]], ['분홍팀', [250, 110, 180]], ['갈색팀', [141, 105, 85]], ['남색팀', [50, 70, 130]],
];
const GRAY = [150, 158, 175];

const inside = new Uint8Array(N); let TOTAL = 0;
for (let y = 0; y < G; y++) for (let x = 0; x < G; x++) {
  const dx = x + 0.5 - C, dy = y + 0.5 - C;
  if (dx * dx + dy * dy <= R * R) { inside[y * G + x] = 1; TOTAL++; }
}

const owner = new Uint8Array(N);   // 영토 주인(플레이어 id)
const trail = new Uint8Array(N);   // 선 주인(플레이어 id)
const area = new Int32Array(256);  // 플레이어별 칸 수
let meta = new Map();              // id -> {id,name,banned,team,rgb,...}
let lastMetaList = [];
const vis = new Map();
let state = { ph: 'lobby', mode: 'solo', tc: 2, endLocal: 0, res: null, gid: 0 };

let role = null;   // 'host' | 'client'
let myId = 0;
let spectateId = 0;
let zoom = 1;
let leaving = false;
let shownGid = -1;

function angDiff(a, b) { let d = a - b; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; }
function esc(s) { return String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch])); }
function fmtTime(ms) { const s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }

/* ================= 색상 ================= */
function hsl(h, s, l) {
  s /= 100; l /= 100;
  const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  return [Math.round(f(0) * 255), Math.round(f(8) * 255), Math.round(f(4) * 255)];
}
const toHex = c => (c[0] << 16) | (c[1] << 8) | c[2];
const cssOf = c => `rgb(${c[0]},${c[1]},${c[2]})`;
function colorsFor(id, team) {
  let rgb;
  if (state.mode === 'team') rgb = team ? TEAMS[team - 1][1] : GRAY;
  else { const i = (id - 1) % 30, h = ((i * 7) % 30) * 12, l = (i % 2) ? 50 : 62; rgb = hsl(h, 72, l); }
  const dark = rgb.map(v => Math.round(v * 0.68));
  return { rgb, hex: toHex(rgb), darkHex: toHex(dark), css: cssOf(rgb) };
}
function setMeta(list) {
  lastMetaList = list;
  const m = new Map();
  for (const [id, name, banned, team] of list) m.set(id, Object.assign({ id, name, banned: !!banned, team: team || 0 }, colorsFor(id, team || 0)));
  meta = m;
  for (const [id, v] of vis) if (!meta.has(id)) { removeVis(v); vis.delete(id); }
  repaintAll();
}
function teamArea(k) { let s = 0; for (const m of meta.values()) if (!m.banned && m.team === k) s += Math.max(0, area[m.id]); return s; }

/* ================= 바닥 텍스처 ================= */
const texData = new Uint8Array(N * 4);
const dflag = new Uint8Array(N); const dlist = [];
function markDirty(c) { if (!dflag[c]) { dflag[c] = 1; dlist.push(c); } }
function paint(c) {
  const cx = c % G, cy = (c / G) | 0, ti = ((G - 1 - cy) * G + cx) * 4;
  let r, g, b; const o = owner[c], m = o ? meta.get(o) : null;
  if (m) { r = m.rgb[0]; g = m.rgb[1]; b = m.rgb[2]; }
  else { const v = (((cx >> 3) + (cy >> 3)) & 1) ? 236 : 230; r = v; g = v + 3; b = v + 8; }
  const t = trail[c];
  if (t) { const tm = meta.get(t); if (tm) { // 반투명 선
    r = (r * 0.45 + tm.rgb[0] * 0.55) | 0; g = (g * 0.45 + tm.rgb[1] * 0.55) | 0; b = (b * 0.45 + tm.rgb[2] * 0.55) | 0; } }
  texData[ti] = r; texData[ti + 1] = g; texData[ti + 2] = b; texData[ti + 3] = 255;
}
function repaintAll() { for (let c = 0; c < N; c++) markDirty(c); }

/* ================= 3D 장면 ================= */
const canvas = $('#c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(innerWidth, innerHeight);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1b2233);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.5, 1200);
scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.3); sun.position.set(60, 120, 40); scene.add(sun);

// 멀리서 볼 때 깨짐 방지: 밉맵 + 비등방성 필터
const tex = new THREE.DataTexture(texData, G, G, THREE.RGBAFormat);
tex.magFilter = THREE.NearestFilter;
tex.minFilter = THREE.LinearMipmapLinearFilter;
tex.generateMipmaps = true;
tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
tex.colorSpace = THREE.SRGBColorSpace; tex.needsUpdate = true;

{
  const geo = new THREE.CircleGeometry(R, 256);
  const pos = geo.attributes.position, uv = geo.attributes.uv;
  for (let i = 0; i < pos.count; i++) uv.setXY(i, (pos.getX(i) + G / 2) / G, (pos.getY(i) + G / 2) / G);
  const ground = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map: tex }));
  ground.rotation.x = -Math.PI / 2; scene.add(ground);
  const rim = new THREE.Mesh(new THREE.TorusGeometry(R + 0.5, 0.8, 12, 256), new THREE.MeshLambertMaterial({ color: 0x9fb0d0 }));
  rim.rotation.x = -Math.PI / 2; rim.position.y = 0.2; scene.add(rim);
  const base = new THREE.Mesh(new THREE.CylinderGeometry(R + 0.4, R - 6, 10, 192), new THREE.MeshLambertMaterial({ color: 0x3a4560 }));
  base.position.y = -5.02; scene.add(base);
}

const SHAPES = [
  new THREE.BoxGeometry(1.1, 1.1, 1.1),
  new THREE.CylinderGeometry(0.62, 0.62, 1.1, 20),
  new THREE.OctahedronGeometry(0.8),
  new THREE.DodecahedronGeometry(0.72),
  new THREE.ConeGeometry(0.78, 1.3, 4),
];
const PTR_GEO = new THREE.ConeGeometry(0.22, 0.5, 10);
const PTR_MAT = new THREE.MeshLambertMaterial({ color: 0xffffff });
const BLOB_GEO = new THREE.CircleGeometry(0.8, 20);
const BLOB_MAT = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.25, depthWrite: false });

function makeLabel(text) {
  const cv = document.createElement('canvas'); cv.width = 320; cv.height = 64;
  const g = cv.getContext('2d');
  g.font = "bold 28px 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif";
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.lineWidth = 6; g.strokeStyle = 'rgba(0,0,0,0.75)'; g.strokeText(text, 160, 34);
  g.fillStyle = '#fff'; g.fillText(text, 160, 34);
  const tx = new THREE.CanvasTexture(cv); tx.colorSpace = THREE.SRGBColorSpace;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tx, depthTest: false, depthWrite: false, sizeAttenuation: false, transparent: true }));
  sp.scale.set(0.2, 0.04, 1); sp.center.set(0.5, 0); sp.renderOrder = 10;
  return sp;
}
function makeVis(id) { const v = { id, rx: C, ry: C, ra: 0, sx: C, sy: C, sa: 0, alive: false, gone: false, t: 0, deadAt: 0, mesh: null }; vis.set(id, v); return v; }
function removeVis(v) {
  if (v.mesh) scene.remove(v.mesh);
  if (v.label) { scene.remove(v.label); v.label.material.map.dispose(); v.label.material.dispose(); }
}
function ensureMesh(v, m) {
  if (!v.mesh) {
    const grp = new THREE.Group();
    v.mat = new THREE.MeshLambertMaterial({ color: m.darkHex });
    v.body = new THREE.Mesh(SHAPES[(v.id - 1) % SHAPES.length], v.mat); grp.add(v.body);
    const ptr = new THREE.Mesh(PTR_GEO, PTR_MAT); ptr.rotation.z = -Math.PI / 2; ptr.position.set(0.95, 0, 0); grp.add(ptr);
    const blob = new THREE.Mesh(BLOB_GEO, BLOB_MAT); blob.rotation.x = -Math.PI / 2; blob.position.y = -0.57; grp.add(blob);
    scene.add(grp); v.mesh = grp; v.colorHex = m.darkHex;
  }
  if (v.colorHex !== m.darkHex) { v.mat.color.setHex(m.darkHex); v.colorHex = m.darkHex; }
  if (v.labelName !== m.name) {
    if (v.label) { scene.remove(v.label); v.label.material.map.dispose(); v.label.material.dispose(); }
    v.label = makeLabel(m.name); scene.add(v.label); v.labelName = m.name;
  }
}

/* ================= 메시지 전송 (큰 메시지는 쪼갬) ================= */
function sendStr(conn, s) {
  if (!conn || !conn.open) return;
  try {
    if (s.length <= CH) { conn.send(s); return; }
    const id = Math.random().toString(36).slice(2, 8), n = Math.ceil(s.length / CH);
    for (let i = 0; i < n; i++) conn.send('#' + id + '|' + i + '|' + n + '|' + s.slice(i * CH, (i + 1) * CH));

  for (const [id, v] of vis) v.gone = !seen.has(id);
  if (msg.tl != null) state.endLocal = now + msg.tl;
  if (!isHost) {
    if (msg.o) applyGroups(msg.o, owner, true);
    if (msg.r) applyGroups(msg.r, trail, false);
  }
  if (msg.e) for (const ev of msg.e) addFeed(ev);
}

/* ================= 화면 표시 ================= */
function showResults(res) {
  const team = res.mode === 'team';
  let html = `<h2>${team ? '🏆 우승 팀 발표' : '🏆 순위 발표'}</h2>`;
  if (!res.list.length) html += '<p>순위에 오른 참가자가 없어요.</p>';
  else {
    html += '<div class="podium">';
    for (const i of [1, 0, 2]) {
      const r = res.list[i];
      if (!r) { html += '<div class="pl"></div>'; continue; }
      html += `<div class="pl p${i + 1}">${i === 0 ? '<div class="crown">👑</div>' : ''}<div class="nm2">${esc(r.name)}</div><div class="rp">땅 ${r.pct.toFixed(1)}%</div>` +
        (r.members ? `<div class="mem">${r.members.map(esc).join(', ')}</div>` : '') +
        `<div class="step" style="background:${r.css}">${i + 1}위</div></div>`;
    }
    html += '</div>';
  }
  html += `<div class="row"><button id="rLobby" class="primary">대기방으로${role === 'host' ? ' (모두)' : ''}</button><button id="rQuit">종료${role === 'host' ? ' (방 닫기)' : ''}</button></div>`;
  $('#resultsCard').innerHTML = html;
  $('#results').classList.remove('hidden');
  $('#rLobby').onclick = () => { $('#results').classList.add('hidden'); if (role === 'host') backToLobby(); };
  $('#rQuit').onclick = () => {
    if (role === 'host') { if (confirm('방을 닫으면 모든 학생의 접속이 끊어져요. 닫을까요?')) closeRoom(); return; }
    leaving = true; try { clientPeer && clientPeer.destroy(); } catch (e) { } location.reload();
  };
}
function addFeed([by, victim, kind]) {
  const nm = id => (meta.get(id) || {}).name || '?';
  let text;
  if (kind === 1) text = `✂️ ${nm(by)}님이 ${nm(victim)}님의 선을 끊었어요!`;
  else if (kind === 2) text = `💥 ${nm(victim)}님이 자기 선에 걸렸어요`;
  else text = `🏳️ ${nm(victim)}님이 땅을 모두 잃었어요`;
  const feed = $('#feed'), el = document.createElement('div'); el.textContent = text;
  feed.appendChild(el); while (feed.children.length > 4) feed.removeChild(feed.firstChild);
  setTimeout(() => el.remove(), 4000);
}
function updateRank() {
  const mm = meta.get(myId);
  let html = '', mine = '';
  if (state.mode === 'team') {
    $('#rankTitle').textContent = '🏆 팀 영토 랭킹';
    const arr = [];
    for (let k = 1; k <= state.tc; k++) {
      const cnt = [...meta.values()].filter(m => !m.banned && m.team === k).length;
      arr.push({ k, name: TEAMS[k - 1][0], css: cssOf(TEAMS[k - 1][1]), a: teamArea(k), cnt });
    }
    arr.sort((a, b) => b.a - a.a || a.k - b.k);
    arr.forEach((r, i) => {
      html += `<li class="${mm && mm.team === r.k ? 'me' : ''}"><span class="no">${i + 1}</span><span class="sw" style="background:${r.css}"></span><span class="nm">${r.name} <small style="opacity:.7">${r.cnt}명</small></span><span class="pc">${(r.a / TOTAL * 100).toFixed(1)}%</span></li>`;
    });
  } else {
    $('#rankTitle').textContent = '🏆 영토 랭킹';
    const arr = [...meta.values()].filter(m => !m.banned).map(m => ({ id: m.id, name: m.name, a: Math.max(0, area[m.id]), css: m.css })).sort((a, b) => b.a - a.a);
    arr.slice(0, 10).forEach((r, i) => {
      html += `<li data-id="${r.id}" class="${r.id === myId ? 'me' : ''}"><span class="no">${i + 1}</span><span class="sw" style="background:${r.css}"></span><span class="nm">${esc(r.name)}</span><span class="pc">${(r.a / TOTAL * 100).toFixed(1)}%</span></li>`;
    });
    if (role === 'client' && myId) {
      const idx = arr.findIndex(r => r.id === myId);
      if (idx >= 10) mine = `내 순위 ${idx + 1}위 · ${(arr[idx].a / TOTAL * 100).toFixed(1)}%`;
    }
  }
  $('#rankList').innerHTML = html || '<li style="opacity:.6">아직 참가자가 없어요</li>';
  $('#myRank').textContent = mine;
}
function updatePlist() {
  const ps = [...sim.players.values()].sort((a, b) => (a.team - b.team) || (area[b.id] - area[a.id]));
  $('#pcount').textContent = ps.length;
  let html = '';
  for (const p of ps) {
    const m = meta.get(p.id); if (!m) continue;
    const st = p.banned ? '관전' : (p.alive ? (area[p.id] / TOTAL * 100).toFixed(1) + '%' : (game.phase === 'results' ? '-' : '부활중'));
    const tn = game.mode === 'team' ? `<small style="opacity:.75">${p.team ? TEAMS[p.team - 1][0] : '팀 미선택'}</small> ` : '';
    html += `<div class="pr"><span class="sw" style="background:${m.css}"></span><span class="nm" data-act="follow" data-id="${p.id}" style="cursor:pointer">${spectateId === p.id ? '👁 ' : ''}${esc(p.name)} ${tn}</span><span class="pc">${st}</span>` +
      `<button data-act="${p.banned ? 'unban' : 'ban'}" data-id="${p.id}" class="${p.banned ? '' : 'danger'}">${p.banned ? '참가 허용' : '관전 전환'}</button></div>`;
  }
  $('#plist').innerHTML = html || '<div style="opacity:.6;font-size:13px">학생들이 방 코드로 들어오면 여기에 보여요</div>';
}
function updateTeamPick() {
  const mm = meta.get(myId);
  const show = role === 'client' && myId && !fatalShown && state.ph === 'lobby' && state.mode === 'team' && mm && !mm.banned;
  $('#teamPick').classList.toggle('hidden', !show);
  if (!show) return;
  $('#teamTitle').textContent = mm.team ? `내 팀: ${TEAMS[mm.team - 1][0]} (다른 팀으로 바꿀 수도 있어요)` : '👇 팀을 골라 주세요';
  let html = '';
  for (let k = 1; k <= state.tc; k++) {
    const cnt = [...meta.values()].filter(m => !m.banned && m.team === k).length;
    html += `<button data-k="${k}" class="${mm.team === k ? 'on' : ''}" style="background:${cssOf(TEAMS[k - 1][1])}">${TEAMS[k - 1][0]}<small>${cnt}명</small></button>`;
  }
  const el = $('#teamBtns'); if (el._h !== html) { el.innerHTML = html; el._h = html; }
}
function updateTimer(now) {
  const el = $('#timer');
  if (state.ph === 'playing') {
    const left = state.endLocal - now;
    el.textContent = '⏱ ' + fmtTime(left); el.className = left < 10500 ? 'hurry' : '';
    if (role === 'host') $('#hostTime').textContent = fmtTime(left);
  } else if (state.ph === 'lobby') {
    el.className = 'lobby';
    el.textContent = role === 'host' ? '대기방 · 설정 후 게임 시작을 눌러 주세요' :
      (state.mode === 'team' ? '대기방 · 팀을 고르고 연습하며 기다려요' : '대기방 · 연습하며 선생님을 기다려요');
  } else { el.className = ''; el.textContent = '게임 종료!'; }
}
let lastCenter = '';
function updateCenter(now) {
  if (fatalShown) return;
  let html = '';
  if (role === 'client' && myId) {
    const me = vis.get(myId), mm = meta.get(myId);
    if (mm && mm.banned) html = '👀 관전 모드<small>방장이 관전으로 바꿨어요. ←/→ 키나 랭킹 이름을 눌러 다른 친구를 볼 수 있어요.</small>';
    else if (state.ph === 'results' && $('#results').classList.contains('hidden')) html = '대기방으로 돌아가는 중<small>선생님이 대기방을 열 때까지 잠시 기다려요</small>';
    else if (state.ph !== 'results' && me && !me.alive && me.deadAt) {
      const s = Math.max(1, Math.ceil((me.deadAt + RESPAWN_MS - now) / 1000));
      html = `선이 끊겼어요!<small>${s}초 후 다시 태어나요</small>`;
    }
  }
  if (html !== lastCenter) {
    lastCenter = html; const el = $('#center');
    if (html) { el.innerHTML = html; el.classList.remove('hidden'); } else el.classList.add('hidden');
  }
}
function aliveIds() { return [...vis.values()].filter(v => v.alive && !v.gone).map(v => v.id).sort((a, b) => a - b); }
function cycleSpectate(dir) {
  const ids = aliveIds(); if (!ids.length) { spectateId = 0; return; }
  let i = ids.indexOf(spectateId); i = (i + dir + ids.length) % ids.length; spectateId = ids[i];
}

const camPos = new THREE.Vector3(0, 250, 135), camLook = new THREE.Vector3(0, 0, 6);
const _p = new THREE.Vector3(), _l = new THREE.Vector3();
let pScale = 2.6;
function updateCamera(dt) {
  let fx = null, fy = null;
  const mm = meta.get(myId), banned = !!(mm && mm.banned);
  if (role === 'client' && myId && !banned) {
    const me = vis.get(myId);
    if (me && (me.alive || me.deadAt)) { fx = me.rx; fy = me.ry; }
  }
  if (fx === null && role === 'client' && banned) {
    const s = vis.get(spectateId); if (!s || !s.alive || s.gone) cycleSpectate(1);
  }
  if (fx === null && spectateId) { const s = vis.get(spectateId); if (s && s.alive && !s.gone) { fx = s.rx; fy = s.ry; } }
  let ts;
  if (fx !== null) { _l.set(fx - G / 2, 0, fy - G / 2); _p.set(_l.x, 26 * zoom, _l.z + 20 * zoom); ts = 1; }
  else { _l.set(0, 0, 6); _p.set(0, 250, 135); ts = 2.6; }
  const k = 1 - Math.exp(-dt * 6);
  camPos.lerp(_p, k); camLook.lerp(_l, k);
  camera.position.copy(camPos); camera.lookAt(camLook);
  pScale += (ts - pScale) * k;
}
function updateVis(v, dt, now) {
  const m = meta.get(v.id);
  if (!m || m.banned || v.gone || !v.alive) { if (v.mesh) { v.mesh.visible = false; v.label.visible = false; } return; }
  ensureMesh(v, m);
  const frozen = state.ph === 'results';
  const e = frozen ? 0 : Math.min((now - v.t) / 1000, 0.15);
  const tx = v.sx + Math.cos(v.sa) * SPEED * e, ty = v.sy + Math.sin(v.sa) * SPEED * e;
  const k = 1 - Math.exp(-dt * 14);
  v.rx += (tx - v.rx) * k; v.ry += (ty - v.ry) * k; v.ra += angDiff(v.sa, v.ra) * k;
  const wx = v.rx - G / 2, wz = v.ry - G / 2;
  v.mesh.visible = true; v.label.visible = true;
  v.mesh.scale.setScalar(pScale);
  v.mesh.position.set(wx, 0.6 * pScale, wz);
  v.mesh.rotation.y = -v.ra;
  v.body.position.y = Math.sin(now / 180 + v.id) * 0.08;
  v.label.position.set(wx, 1.5 * pScale, wz);
  const ls = pScale > 1.5 ? 0.7 : 1; v.label.scale.set(0.2 * ls, 0.04 * ls, 1);
}

let last = performance.now(), lastHud = 0;
function frame() {
  requestAnimationFrame(frame);
  const now = performance.now(), dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (dlist.length) { for (const c of dlist) { paint(c); dflag[c] = 0; } dlist.length = 0; tex.needsUpdate = true; }
  for (const v of vis.values()) updateVis(v, dt, now);
  updateCamera(dt);
  renderer.render(scene, camera);
  if (role) { updateCenter(now); updateTimer(now); }
  if (now - lastHud > 500) { lastHud = now; if (role) { updateRank(); updateTeamPick(); } if (role === 'host') updatePlist(); }
}
requestAnimationFrame(frame);

/* ================= 입력 ================= */
const IS_TOUCH = (window.matchMedia && matchMedia('(pointer: coarse)').matches) || ('ontouchstart' in window);
let tAng = 0, lastSent = null; const keys = new Set();
function pointerSteer(e) {
  if (role !== 'client' || e.pointerType === 'touch') return;   // 터치는 조이스틱으로
  if (e.target.closest && e.target.closest('.panel,#results,#joy')) return;
  const dx = e.clientX - innerWidth / 2, dy = e.clientY - innerHeight / 2;
  if (dx * dx + dy * dy < 100) return;
  tAng = Math.atan2(dy, dx);
}
window.addEventListener('pointermove', pointerSteer);
window.addEventListener('pointerdown', pointerSteer);

// 모바일 조이스틱
{
  const joy = $('#joy'), knob = $('#knob'); let active = null;
  const move = e => {
    const r = joy.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    let dx = e.clientX - cx, dy = e.clientY - cy; const len = Math.hypot(dx, dy), max = r.width / 2 - 14;
    if (len > max) { dx = dx / len * max; dy = dy / len * max; }
    knob.style.transform = `translate(${dx}px,${dy}px)`;
    if (len > 8) tAng = Math.atan2(dy, dx);
  };
  joy.addEventListener('pointerdown', e => { active = e.pointerId; try { joy.setPointerCapture(e.pointerId); } catch (_) { } move(e); e.preventDefault(); });
  joy.addEventListener('pointermove', e => { if (e.pointerId === active) move(e); });
  const end = e => { if (e.pointerId !== active) return; active = null; knob.style.transform = ''; };
  joy.addEventListener('pointerup', end); joy.addEventListener('pointercancel', end);
}

function keySteer() {
  const has = (...k) => k.some(x => keys.has(x));
  const x = (has('arrowright', 'd') ? 1 : 0) - (has('arrowleft', 'a') ? 1 : 0);
  const y = (has('arrowdown', 's') ? 1 : 0) - (has('arrowup', 'w') ? 1 : 0);
  if (x || y) tAng = Math.atan2(y, x);
}
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const k = e.key.toLowerCase(); keys.add(k);
  if (k.startsWith('arrow')) e.preventDefault();
  const mm = meta.get(myId);
  if (role === 'client' && mm && mm.banned) { if (k === 'arrowright') cycleSpectate(1); if (k === 'arrowleft') cycleSpectate(-1); return; }
  keySteer();
});
window.addEventListener('keyup', e => { keys.delete(e.key.toLowerCase()); keySteer(); });
setInterval(() => {
  if (role !== 'client' || !hostConn || !myId) return;
  if (lastSent === null || Math.abs(angDiff(tAng, lastSent)) > 0.01) { sendStr(hostConn, JSON.stringify({ t: 'i', a: +tAng.toFixed(3) })); lastSent = tAng; }
}, 50);
window.addEventListener('wheel', e => { zoom = Math.min(3, Math.max(0.5, zoom * (1 + e.deltaY * 0.001))); }, { passive: true });
window.addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });

$('#rankList').addEventListener('pointerdown', e => {
  const li = e.target.closest('li[data-id]'); if (!li) return;
  const mm = meta.get(myId);
  if (role === 'host' || (mm && mm.banned)) spectateId = +li.dataset.id;
});
$('#plist').addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const id = +el.dataset.id, act = el.dataset.act;
  if (act === 'follow') spectateId = (spectateId === id) ? 0 : id;
  else if (act === 'ban') setBan(id, true);
  else if (act === 'unban') setBan(id, false);
  updatePlist();
});
$('#teamBtns').addEventListener('pointerdown', e => {
  const b = e.target.closest('button[data-k]'); if (!b || !hostConn) return;
  sendStr(hostConn, JSON.stringify({ t: 'team', k: +b.dataset.k }));
});
$('#btnOverview').addEventListener('click', () => { spectateId = 0; });
$('#mSolo').addEventListener('click', () => setMode('solo'));
$('#mTeam').addEventListener('click', () => setMode('team'));
$('#inTeams').addEventListener('change', e => setTeamCount(e.target.value));
$('#inTime').addEventListener('change', e => { let t = Math.round(+e.target.value) || 180; e.target.value = Math.min(9999, Math.max(10, t)); });
$('#btnStart').addEventListener('click', startGame);
$('#btnStop').addEventListener('click', () => { if (confirm('지금 게임을 끝내고 결과를 발표할까요?')) endGame(); });

/* ================= 처음 화면 ================= */
const qsRoom = new URLSearchParams(location.search).get('room');
if (qsRoom) $('#inCode').value = qsRoom.toUpperCase();
try { const saved = localStorage.getItem('paperio-name'); if (saved) $('#inName').value = saved; } catch (e) { }
$('#btnHost').addEventListener('click', () => { $('#hostBox').classList.toggle('hidden'); $('#inTeacher').focus(); });
$('#btnHostGo').addEventListener('click', () => {
  if (role) return;
  if ($('#inTeacher').value !== TEACHER_CODE) { $('#lobbyMsg').textContent = '선생님 코드가 맞지 않아요.'; return; }
  startHost();
});
$('#inTeacher').addEventListener('keydown', e => { if (e.key === 'Enter') $('#btnHostGo').click(); });
$('#btnJoin').addEventListener('click', () => {
  if (role) return;
  const name = $('#inName').value.trim(), code = $('#inCode').value.trim().toUpperCase();
  if (!name) { $('#lobbyMsg').textContent = '이름을 입력해 주세요.'; return; }
  if (code.length !== 5) { $('#lobbyMsg').textContent = '5글자 방 코드를 입력해 주세요.'; return; }
  try { localStorage.setItem('paperio-name', name); } catch (e) { }
  startClient(code, name);
});
['inName', 'inCode'].forEach(id => $('#' + id).addEventListener('keydown', e => { if (e.key === 'Enter') $('#btnJoin').click(); }));
</script>
